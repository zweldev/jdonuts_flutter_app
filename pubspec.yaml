name: jdonuts_flutter_app
description: "A new Flutter project."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.13.7
  flutter: ">=3.47.9"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Network images
  cached_network_image: ^4.0.6

  # SQLite persistence
  drift: ^2.35.3

  # Navigation
  go_router: ^18.1.3

  # State management
  bloc: ^9.2.1
  flutter_bloc: ^9.1.1

  # Dependency injection
  get_it: ^9.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/onboarding/onboarding_bg.png