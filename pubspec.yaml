name: jdonuts_flutter_app
description: "A new Flutter project."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.13.7
  flutter: ">=3.47.9"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Network images
  cached_network_image: ^4.0.6

  # SQLite persistence
  drift: ^2.35.3
  path_provider: ^2.1.5
  sqlite3_flutter_libs: ^0.5.40
  connectivity_plus: ^7.3.2

  # Navigation
  go_router: ^18.1.3

  # State management
  bloc: ^9.2.1
  flutter_bloc: ^9.1.1

  # Dependency injection
  get_it: ^9.3.0
  material_ui: ^1.10.0
  pinput: ^7.0.0
  flutter_svg: ^2.3.2
  flutter_secure_storage: ^11.2.0
  uuid: ^4.5.1

  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  freezed: ^4.0.3
  build_runner: ^2.17.1
  drift_dev: ^2.35.2
  json_serializable: ^6.15.2

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/challenge_items/
    - assets/images/onboarding/
    - assets/images/products/
    - assets/images/seasonal_products/
    - assets/images/shops/
    - assets/images/welcome_screen/
    - assets/icons/